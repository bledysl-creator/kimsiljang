name: 수집하고 배포하기

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *' # 매일 한국시간 오전 7시 (GitHub 사정으로 늦어질 수 있어요)
  workflow_dispatch: # Actions 탭에서 '지금 실행' 가능 (브랜치 선택 시 수집만 테스트)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 가게 찾기 · 콜키지 후기 분석
        id: collect
        if: github.event_name != 'push'
        # 실패해도 이전 데이터는 남기고 '수집 실패'만 기록한 뒤 배포는 계속해요
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect

      - name: 수집 결과 저장소에 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "our-table-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet && exit 0
          git commit -m "데이터 자동 갱신 $(date +%F)"
          # 수집 중에 다른 커밋이 올라왔으면 그 위에 다시 얹어서 올려요
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i * 5)); done
          exit 1

      - name: 린트 · 테스트
        run: npm run lint && npm test

      - name: 빌드
        env:
          GITHUB_PAGES: '1'
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
