name: 수집하고 배포하기

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 21 * * *' # 매일 한국시간 오전 6시
  workflow_dispatch: # Actions 탭에서 '지금 실행' 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 블로그 후기, 가게 정보 수집
        if: github.event_name != 'push'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: npm run collect

      - name: 수집 결과 저장소에 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "kimsiljang-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || (git commit -m "데이터 자동 갱신 $(date +%F)" && git push)

      - name: 빌드
        env:
          VITE_KAKAO_JS_KEY: ${{ secrets.KAKAO_JS_KEY }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
